name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit tests + smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Qt system libraries
        # PySide6 needs these even for the offscreen QPA platform.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Run headless smoke test
        # scripts/smoke.py builds a full Qt window; the offscreen QPA
        # platform lets it run without a real display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke.py
